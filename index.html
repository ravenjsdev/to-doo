<!DOCTYPE html> 
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Turn your plans into progress. To-Doo helps you organize your tasks, stay focused, and keep moving forward — one task, one goal, one step at a time.">
    <title>To-Doo - online to-do list</title>
    <link rel="icon" type="image/svg+xml" href="css/main-page-svgs/logo.svg">
    <link rel="stylesheet"  href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    
      <div class="title-section">
        <div class="hamburger-menu">
          <div class="logo-section">
          <div class="logo-container">
            <button class="logo-btn">✔</button>
            <p class="logo-text">To-Doo</p>
          </div>
          <div class="logo-collapsed">
            <button class="logo-btn collapsed">✔</button>
          </div>
        </div>
        </div>
        <div class="day-section">
          <p class="list-title" contenteditable="true">New list</p>
        </div>
      </div>
    <div class="main-page">
      <div class="side-container">
        <div class="side-menu">
        <div class="side-menu-upper">
          <div class="add-lists">Add a new list <span class="plus-span">ᐩ</span></div>
        </div>
        <div class="lists-area">
            <div class="your-lists">Your lists:</div>
          <div class="lists-container">
          </div>
        </div>
        <div class="coffee-section">
          <a href="https://mail.google.com/mail/?view=cm&fs=1&to=ravenjsdev@gmail.com&su=Hello%2C%20thanks%20for%20using%20To-Doo!" target="_blank" rel="noopener" class="link-css">
            <div class="gmail-cont">
            <img src="css/main-page-svgs/gmail-app-icon.svg" alt="contact-me-icon" class="gmail-svg">
            <p class="gmail-text">Contact me(GMAIL)</p>
          </div>
          </a>
          <a href="https://ko-fi.com/ravenjs" target="_blank" rel="noopener" class="link-css">
            <div class="coffee-buy">
            <img src="css/main-page-svgs/buy-me-a-coffeesvg.svg" alt="buy-coffee-icon" class="coffee-icon">
            <p class="coffee-text">buy me a coffee</p>
          </div>
          </a>
        </div>
      </div>
        <div class="side-section">
          <div class="collapsed-container">
            <div class="icons-div">
              <span class="add-icon">ᐩ</span>
            </div>
            <div class="coffee-col-container">
              <a href="https://mail.google.com/mail/?view=cm&fs=1&to=ravenjsdev@gmail.com&su=Hello%2C%20thanks%20for%20using%20To-Doo!" target="_blank" rel="noopener" class="link-css">
                <div class="email-svg"><img src="css/main-page-svgs/gmail-app-icon.svg" alt="contact-me-icon" class="email-icon"></div>
              </a>
              <a href="https://ko-fi.com/ravenjs" target="_blank" rel="noopener" class="link-css">
                <div class="coffee-collapsed"><img src="css/main-page-svgs/buy-me-a-coffeesvg.svg" alt="buy-coffee-icon" class="coffee-icon"></div>
              </a>
            </div>
          </div>
        </div>
      </div>
      <div class="tasks-section">
        <div class="tasks-area">
          <div class="add-section">
            <input type="text" placeholder="Add a task. . ." class="add-inp">
            <button class="add-btn">ADD</button>
          </div>
          <div class="tasks-box"><p>To-Doo gives you a clean and simple place to plan your day and
turn your plans into progress.</p><p>Organize your tasks create lists.</p><p>Stay focused on your goals.</p></div>
          <footer class="copyright">© 2026 ravenjs</footer>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
